name: Update Dashboard Data

on:
  schedule:
    # 北京时间 9:30 / 18:30 (UTC 1:30 / 10:30)，错峰避开 GH 整点拥堵
    - cron: '30 1 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch prices
        run: python scripts/fetch_prices.py
        continue-on-error: true

      - name: Fetch indicators
        run: python scripts/fetch_indicators.py
        continue-on-error: true

      - name: Compute hype scores
        run: python scripts/compute_hype_scores.py
        continue-on-error: true

      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add public/dashboard/snapshots/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 看板数据自动更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Trigger Pages deploy
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
