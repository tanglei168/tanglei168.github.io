<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K1–K12 知行图谱 · 杭州·余杭家庭版</title>
<link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
<a class="skip-link" href="#mainContent">跳到主要内容</a>
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a class="brand" href="#/">
      <span class="seal-logo" aria-hidden="true"><span>知</span><span>行</span></span>
      <span class="brand-text">
        <strong>K1–K12 知行图谱</strong>
        <small>杭州·余杭家庭版 · 教材同步 · 高考框架下的项目式学习</small>
      </span>
    </a>
    <nav class="nav-desktop" id="navDesktop" aria-label="站点导航"></nav>
    <div class="grade-picker-wrap">
      <label for="gradePickerTop" class="grade-picker-label">年级</label>
      <select id="gradePickerTop" class="grade-picker" aria-label="选择年级"></select>
    </div>
  </div>
</header>

<nav class="nav-mobile" id="navMobile" aria-label="底部导航"></nav>

<main id="mainContent" class="main-wrap">
  <div id="viewHost" class="view-host" aria-live="polite"></div>
</main>

<div id="filterSheet" class="sheet-backdrop" hidden>
  <div class="sheet panel" role="dialog" aria-modal="true" aria-labelledby="filterSheetTitle">
    <div class="sheet-head">
      <h2 id="filterSheetTitle">筛选项目</h2>
      <button type="button" class="icon-btn" id="filterSheetClose" aria-label="关闭">×</button>
    </div>
    <div id="filterSheetBody" class="sheet-body"></div>
    <div class="sheet-foot">
      <button type="button" class="btn btn-primary" id="filterSheetApply">应用</button>
    </div>
  </div>
</div>

<div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
<aside id="projectDrawer" class="project-drawer" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-toolbar">
    <button type="button" class="icon-btn" id="drawerClose" aria-label="关闭">×</button>
    <div class="drawer-actions">
      <button type="button" class="btn btn-ghost" id="drawerPrev">上一个</button>
      <button type="button" class="btn btn-ghost" id="drawerNext">下一个</button>
      <button type="button" class="btn btn-ghost" id="drawerCopy">复制链接</button>
      <button type="button" class="btn btn-ghost" id="drawerPrint">打印此卡</button>
    </div>
  </div>
  <div id="drawerContent" class="drawer-content print-drawer-target"></div>
</aside>

<div id="errBadge"></div>

<script src="./data.js?v=2"></script>
<script>
"use strict";
window.__jsErrors = [];
(function(){
  function push(msg){
    window.__jsErrors.push(String(msg));
    var b = document.getElementById('errBadge');
    if (b){ b.style.display = 'block'; b.textContent = '页面脚本出现错误：' + String(msg).slice(0,120); }
  }
  window.addEventListener('error', function(e){ push(e.message || 'unknown error'); });
  window.addEventListener('unhandledrejection', function(e){ push(e.reason); });
})();
</script>
<script src="./app.js?v=2"></script>
</body>
</html>
