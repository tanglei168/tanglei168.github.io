<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 340" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans SC, JetBrains Mono, sans-serif"><rect x="0" y="0" width="920" height="340" fill="#0f0f10"/>
          <defs><marker id="f2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a92"/></marker></defs>

          <!-- step1 model -->
          <rect x="20" y="120" width="120" height="100" rx="13" fill="#16161a" stroke="#d6705f" stroke-width="0.8"/>
          <rect x="52" y="142" width="56" height="34" rx="5" fill="#1e1820" stroke="#d6705f" stroke-width="0.9"/>
          <text x="80" y="163" fill="#d6705f" font-size="9" text-anchor="middle">模型权重</text>
          <text x="80" y="196" fill="#e9e9ec" font-size="11" text-anchor="middle" font-weight="500">一个模型</text>
          <text x="80" y="211" fill="#6d6d77" font-size="8" text-anchor="middle">训练完的成品</text>

          <line x1="140" y1="170" x2="186" y2="170" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#f2)"/>
          <text x="163" y="158" fill="#a3a3ad" font-size="9.5" text-anchor="middle" font-weight="500">装进</text>

          <!-- step2 one replica -->
          <rect x="188" y="110" width="150" height="120" rx="14" fill="#16161a" stroke="#b98ad6" stroke-width="0.9"/>
          <text x="263" y="134" fill="#b98ad6" font-size="11" text-anchor="middle" font-weight="600">1 个副本</text>
          <g fill="#1d1726" stroke="#b98ad6" stroke-width="0.7">
            <rect x="206" y="146" width="26" height="22" rx="3"/><rect x="238" y="146" width="26" height="22" rx="3"/>
            <rect x="270" y="146" width="26" height="22" rx="3"/><rect x="302" y="146" width="26" height="22" rx="3"/>
          </g>
          <text x="263" y="190" fill="#a3a3ad" font-size="9" text-anchor="middle">能独立装下模型的</text>
          <text x="263" y="205" fill="#a3a3ad" font-size="9" text-anchor="middle">最小单位(1–8 卡)</text>
          <text x="263" y="221" fill="#6d6d77" font-size="8" text-anchor="middle" font-family="JetBrains Mono">vLLM / TRT-LLM 引擎</text>

          <line x1="338" y1="170" x2="384" y2="170" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#f2)"/>
          <text x="361" y="158" fill="#a3a3ad" font-size="9.5" text-anchor="middle" font-weight="500">复制 ×N</text>

          <!-- step3 fleet -->
          <!-- load balancer -->
          <rect x="430" y="44" width="430" height="40" rx="11" fill="#16161a" stroke="#7d8aa8" stroke-width="0.9"/>
          <text x="645" y="69" fill="#aab4c8" font-size="11" text-anchor="middle" font-weight="600">负载均衡 · 把请求分给空闲副本</text>

          <!-- 4 independent replicas -->
          <g>
            <rect x="430" y="150" width="92" height="96" rx="12" fill="#171420" stroke="#b98ad6" stroke-width="0.8"/>
            <rect x="542" y="150" width="92" height="96" rx="12" fill="#171420" stroke="#b98ad6" stroke-width="0.8"/>
            <rect x="654" y="150" width="92" height="96" rx="12" fill="#171420" stroke="#b98ad6" stroke-width="0.8"/>
            <rect x="768" y="150" width="92" height="96" rx="12" fill="#171420" stroke="#b98ad6" stroke-width="0.8"/>
          </g>
          <g fill="#b98ad6" font-size="10" text-anchor="middle" font-weight="500">
            <text x="476" y="184">副本 A</text><text x="588" y="184">副本 B</text>
            <text x="700" y="184">副本 C</text><text x="814" y="184">副本 …N</text>
          </g>
          <g fill="#9a85a8" font-size="8" text-anchor="middle">
            <text x="476" y="204">独立接客</text><text x="588" y="204">独立接客</text>
            <text x="700" y="204">独立接客</text><text x="814" y="204">独立接客</text>
          </g>
          <g fill="#6d6d77" font-size="7.5" text-anchor="middle">
            <text x="476" y="232">忙了就加一台</text><text x="588" y="232">闲了就关一台</text>
            <text x="700" y="232">坏了不影响别人</text><text x="814" y="232">可跨机房</text>
          </g>
          <!-- LB to replicas -->
          <g stroke="#7d8aa8" stroke-width="1.2" opacity="0.7" marker-end="url(#f2)">
            <line x1="500" y1="84" x2="476" y2="150"/><line x1="588" y1="84" x2="588" y2="150"/>
            <line x1="700" y1="84" x2="700" y2="150"/><line x1="790" y1="84" x2="814" y2="150"/>
          </g>

          <!-- NO link between replicas (dashed crossed) -->
          <g stroke="#6d6d77" stroke-width="1" stroke-dasharray="3 4" opacity="0.6">
            <line x1="522" y1="226" x2="542" y2="226"/><line x1="634" y1="226" x2="654" y2="226"/><line x1="746" y1="226" x2="768" y2="226"/>
          </g>
          <text x="645" y="276" fill="#8a8a92" font-size="9.5" text-anchor="middle">副本之间<tspan fill="#d6705f" font-weight="500">不需要</tspan>高速互连(虚线 = 普通网络足矣)</text>
          <text x="645" y="296" fill="#6d6d77" font-size="9" text-anchor="middle" font-family="Noto Sans SC">↑ 和训练正相反:训练把所有卡连成一体,推理是一堆互不相连的副本</text>
        </svg>