<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans SC, JetBrains Mono, sans-serif"><rect x="0" y="0" width="920" height="360" fill="#0f0f10"/>
          <defs>
            <marker id="f" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8a92"/></marker>
            <marker id="k" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b98ad6"/></marker>
          </defs>

          <!-- user -->
          <rect x="30" y="140" width="92" height="64" rx="12" fill="#16161a" stroke="#2b2b33" stroke-width="0.8"/>
          <text x="76" y="168" fill="#e9e9ec" font-size="12" text-anchor="middle" font-weight="500">用户</text>
          <text x="76" y="186" fill="#6d6d77" font-size="8.5" text-anchor="middle">提出问题</text>

          <line x1="122" y1="172" x2="168" y2="172" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#f)"/>

          <!-- router -->
          <rect x="168" y="138" width="104" height="68" rx="12" fill="#16161a" stroke="#7d8aa8" stroke-width="0.9"/>
          <text x="220" y="166" fill="#aab4c8" font-size="11" text-anchor="middle" font-weight="600">路由 / 分发</text>
          <text x="220" y="184" fill="#6d6d77" font-size="8" text-anchor="middle">挑一个空闲副本</text>
          <text x="220" y="196" fill="#6d6d77" font-size="8" text-anchor="middle">送过去</text>

          <line x1="272" y1="172" x2="316" y2="172" stroke="#8a8a92" stroke-width="1.4" marker-end="url(#f)"/>

          <!-- prefill -->
          <rect x="318" y="70" width="236" height="92" rx="14" fill="#1a1410" stroke="#f0a35e" stroke-width="0.9"/>
          <text x="338" y="96" fill="#f0a35e" font-size="12" font-weight="600">① 读题 · Prefill</text>
          <text x="338" y="118" fill="#e9e9ec" font-size="10.5">一口气读完整个问题,理解全文。</text>
          <text x="338" y="136" fill="#e9e9ec" font-size="10.5"><tspan fill="#f0a35e">很费"算力"</tspan>,但只做一次。</text>
          <text x="338" y="153" fill="#9a8a78" font-size="8.5" font-family="JetBrains Mono">决定"多久蹦出第一个字"(TTFT)</text>

          <!-- decode -->
          <rect x="318" y="200" width="236" height="100" rx="14" fill="#171420" stroke="#b98ad6" stroke-width="0.9"/>
          <text x="338" y="226" fill="#b98ad6" font-size="12" font-weight="600">② 答题 · Decode</text>
          <text x="338" y="248" fill="#e9e9ec" font-size="10.5">一个字一个字往外蹦,反复进行。</text>
          <text x="338" y="266" fill="#e9e9ec" font-size="10.5"><tspan fill="#b98ad6">很费"显存带宽"</tspan>,要算很多次。</text>
          <text x="338" y="283" fill="#9a85a8" font-size="8.5" font-family="JetBrains Mono">决定"打字速度"(TPOT)</text>

          <!-- prefill->decode -->
          <line x1="436" y1="162" x2="436" y2="200" stroke="#b98ad6" stroke-width="2.2" marker-end="url(#k)"/>
          <text x="452" y="186" fill="#b98ad6" font-size="9" font-weight="500">交接笔记 (KV)</text>

          <!-- back to user -->
          <path d="M318 250 C 180 290, 100 250, 76 204" stroke="#8a8a92" stroke-width="1.4" fill="none" marker-end="url(#f)"/>
          <text x="150" y="288" fill="#6d6d77" font-size="8.5">流式返回,逐字显示</text>

          <!-- why box -->
          <rect x="600" y="96" width="296" height="180" rx="14" fill="#16161a" stroke="#2b2b33" stroke-width="0.8"/>
          <text x="620" y="122" fill="#e9e9ec" font-size="12" font-weight="600">为什么要分成两步?</text>
          <text x="620" y="148" fill="#a3a3ad" font-size="10.5">"读题"和"答题"对硬件的需求</text>
          <text x="620" y="164" fill="#a3a3ad" font-size="10.5"><tspan fill="#e9e9ec" font-weight="500">正好相反</tspan>:一个吃算力,一个吃带宽。</text>
          <text x="620" y="190" fill="#a3a3ad" font-size="10.5">混在一张卡上,一道<tspan fill="#f0a35e">长问题的"读题"</tspan></text>
          <text x="620" y="206" fill="#a3a3ad" font-size="10.5">会卡住别人正在<tspan fill="#b98ad6">"答题"</tspan>的进度,</text>
          <text x="620" y="222" fill="#a3a3ad" font-size="10.5">让所有人的打字都一卡一卡的。</text>
          <text x="620" y="250" fill="#9bc96b" font-size="10.5" font-weight="500">→ 拆到两批不同的机器上,</text>
          <text x="620" y="266" fill="#9bc96b" font-size="10.5" font-weight="500">&#160;&#160;&#160;各自专心,谁也不拖累谁。</text>
        </svg>