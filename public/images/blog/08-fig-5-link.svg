<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 286" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans SC, JetBrains Mono, sans-serif"><rect x="0" y="0" width="920" height="286" fill="#0f0f10"/>
          <defs><marker id="mc" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8a8a92"/></marker></defs>

          <!-- scale-out chain -->
          <text x="20" y="40" fill="#56c2cf" font-size="10.5" font-weight="600" font-family="JetBrains Mono">SCALE-OUT 链路(跨节点)· 经光模块 + 光纤</text>
          <g>
            <rect x="20"  y="56" width="66"  height="46" rx="9" fill="#16161a" stroke="#d6705f" stroke-width="0.8"/>
            <rect x="104" y="56" width="80"  height="46" rx="9" fill="#16161a" stroke="#7d8aa8" stroke-width="0.8"/>
            <rect x="202" y="56" width="120" height="46" rx="9" fill="#16161a" stroke="#56c2cf" stroke-width="0.8"/>
            <rect x="340" y="56" width="80"  height="46" rx="9" fill="#101c1c" stroke="#56c2cf" stroke-width="1"/>
            <rect x="476" y="56" width="80"  height="46" rx="9" fill="#101c1c" stroke="#56c2cf" stroke-width="1"/>
            <rect x="574" y="56" width="150" height="46" rx="9" fill="#16161a" stroke="#56c2cf" stroke-width="0.8"/>
          </g>
          <g text-anchor="middle">
            <text x="53"  y="76" fill="#d6705f" font-size="9" font-weight="600">GPU</text><text x="53" y="90" fill="#9a8a78" font-size="7">算力源</text>
            <text x="144" y="76" fill="#aab4c8" font-size="8.5" font-weight="600">PCIe Gen5</text><text x="144" y="90" fill="#6d6d77" font-size="7">+ retimer</text>
            <text x="262" y="73" fill="#56c2cf" font-size="8.5" font-weight="600">NIC ConnectX-7</text><text x="262" y="85" fill="#56c2cf" font-size="8.5" font-weight="600">/ DPU BlueField-3</text><text x="262" y="97" fill="#6d6d77" font-size="6.5">收发 + 卸载</text>
            <text x="380" y="74" fill="#56c2cf" font-size="8.5" font-weight="600">光模块</text><text x="380" y="87" fill="#5a8e94" font-size="7">OSFP 400G</text><text x="380" y="97" fill="#6d6d77" font-size="6.5">光电转换</text>
            <text x="516" y="74" fill="#56c2cf" font-size="8.5" font-weight="600">光模块</text><text x="516" y="87" fill="#5a8e94" font-size="7">OSFP</text><text x="516" y="97" fill="#6d6d77" font-size="6.5">电光转换</text>
            <text x="649" y="74" fill="#56c2cf" font-size="8.5" font-weight="600">IB 交换机 ASIC</text><text x="649" y="88" fill="#5a8e94" font-size="7">Quantum-2 · 64×400G</text><text x="649" y="98" fill="#6d6d77" font-size="6.5">+ SHARP</text>
          </g>
          <!-- arrows -->
          <g stroke="#8a8a92" stroke-width="1.3" marker-end="url(#mc)">
            <line x1="86" y1="79" x2="104" y2="79"/><line x1="184" y1="79" x2="202" y2="79"/>
            <line x1="322" y1="79" x2="340" y2="79"/><line x1="556" y1="79" x2="574" y2="79"/>
          </g>
          <!-- fiber between optics -->
          <line x1="420" y1="79" x2="476" y2="79" stroke="#56c2cf" stroke-width="2" stroke-dasharray="2 3"/>
          <text x="448" y="73" fill="#56c2cf" font-size="7.5" text-anchor="middle">光纤 MPO</text>
          <!-- DAC alt note -->
          <text x="380" y="120" fill="#9a8a78" font-size="8" text-anchor="middle">短距(同柜)可用 <tspan fill="#e0a35e">DAC/AOC 铜缆</tspan> 替代两端光模块 → 省电省钱</text>

          <!-- scale-up chain -->
          <text x="20" y="160" fill="#f0a35e" font-size="10.5" font-weight="600" font-family="JetBrains Mono">SCALE-UP 链路(NVLink 域内 · NVL72)· 全程铜缆,无光模块</text>
          <g>
            <rect x="20"  y="176" width="66"  height="46" rx="9" fill="#16161a" stroke="#d6705f" stroke-width="0.8"/>
            <rect x="104" y="176" width="80"  height="46" rx="9" fill="#1a1410" stroke="#f0a35e" stroke-width="0.8"/>
            <rect x="202" y="176" width="170" height="46" rx="9" fill="#1a1410" stroke="#f0a35e" stroke-width="0.9"/>
            <rect x="390" y="176" width="120" height="46" rx="9" fill="#1a1410" stroke="#f0a35e" stroke-width="0.8"/>
          </g>
          <g text-anchor="middle">
            <text x="53"  y="196" fill="#d6705f" font-size="9" font-weight="600">GPU</text><text x="53" y="210" fill="#9a8a78" font-size="7">NVLink 口</text>
            <text x="144" y="196" fill="#f0a35e" font-size="8.5" font-weight="600">NVLink 5</text><text x="144" y="210" fill="#9a8a78" font-size="7">1.8 TB/s</text>
            <text x="287" y="196" fill="#f0a35e" font-size="8.5" font-weight="600">铜缆背板 / NVLink Spine 铜缆</text><text x="287" y="210" fill="#9a8a78" font-size="7">短距、无需光电转换</text>
            <text x="450" y="196" fill="#f0a35e" font-size="8.5" font-weight="600">NVSwitch ASIC</text><text x="450" y="210" fill="#9a8a78" font-size="7">NVSwitch5</text>
          </g>
          <g stroke="#8a8a92" stroke-width="1.3" marker-end="url(#mc)">
            <line x1="86" y1="199" x2="104" y2="199"/><line x1="184" y1="199" x2="202" y2="199"/><line x1="372" y1="199" x2="390" y2="199"/>
          </g>

          <!-- right note -->
          <rect x="540" y="172" width="360" height="54" rx="10" fill="#16161a" stroke="#f0a35e" stroke-width="0.7"/>
          <text x="556" y="190" fill="#f0a35e" font-size="9" font-weight="600">为什么 NVL72 用铜不用光?</text>
          <text x="556" y="206" fill="#a3a3ad" font-size="8.5">光模块功耗高、是头号故障源。域内短距用铜缆 →</text>
          <text x="556" y="220" fill="#a3a3ad" font-size="8.5">省下大量光模块功耗、提升可靠性(代价:距离受限)</text>

          <!-- bottom emerging + confidence -->
          <line x1="20" y1="244" x2="900" y2="244" stroke="#2b2b33" stroke-width="0.7" stroke-dasharray="3 4"/>
          <text x="20" y="262" fill="#a3a3ad" font-size="9">新趋势:<tspan fill="#56c2cf">共封装光学 CPO</tspan>(光引擎封进交换机,砍光模块功耗)· <tspan fill="#56c2cf">光交换 OCS</tspan>(可重构拓扑)· 冷板/沉浸式液冷(应对 &gt;100kW/柜)</text>
          <text x="20" y="278" fill="#6d6d77" font-size="8">置信度:光模块/DAC/NIC/DPU/NVSwitch/铜缆背板 = 高 · CPO/OCS = 中(近年发布、部分商用)</text>
        </svg>