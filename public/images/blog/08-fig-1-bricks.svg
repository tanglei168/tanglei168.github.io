<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 250" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans SC, JetBrains Mono, sans-serif"><rect x="0" y="0" width="920" height="250" fill="#0f0f10"/>
      <!-- left: training supercomputer (tightly wired grid) -->
      <text x="40" y="34" fill="#f0a35e" font-size="12" font-weight="600">预训练 · 一台超级计算机</text>
      <text x="40" y="50" fill="#9a8a78" font-size="9">所有设备焊成一体 · 全互连 · 掉一个全停</text>
      <g fill="#1e1820" stroke="#d6705f" stroke-width="0.8">
        <rect x="50" y="68" width="40" height="34" rx="5"/><rect x="100" y="68" width="40" height="34" rx="5"/><rect x="150" y="68" width="40" height="34" rx="5"/><rect x="200" y="68" width="40" height="34" rx="5"/>
        <rect x="50" y="112" width="40" height="34" rx="5"/><rect x="100" y="112" width="40" height="34" rx="5"/><rect x="150" y="112" width="40" height="34" rx="5"/><rect x="200" y="112" width="40" height="34" rx="5"/>
        <rect x="50" y="156" width="40" height="34" rx="5"/><rect x="100" y="156" width="40" height="34" rx="5"/><rect x="150" y="156" width="40" height="34" rx="5"/><rect x="200" y="156" width="40" height="34" rx="5"/>
      </g>
      <!-- dense interconnect -->
      <g stroke="#f0a35e" stroke-width="0.8" opacity="0.45">
        <line x1="90" y1="85" x2="100" y2="85"/><line x1="140" y1="85" x2="150" y2="85"/><line x1="190" y1="85" x2="200" y2="85"/>
        <line x1="90" y1="129" x2="100" y2="129"/><line x1="140" y1="129" x2="150" y2="129"/><line x1="190" y1="129" x2="200" y2="129"/>
        <line x1="90" y1="173" x2="100" y2="173"/><line x1="140" y1="173" x2="150" y2="173"/><line x1="190" y1="173" x2="200" y2="173"/>
        <line x1="70" y1="102" x2="70" y2="112"/><line x1="120" y1="102" x2="120" y2="112"/><line x1="170" y1="102" x2="170" y2="112"/><line x1="220" y1="102" x2="220" y2="112"/>
        <line x1="70" y1="146" x2="70" y2="156"/><line x1="120" y1="146" x2="120" y2="156"/><line x1="170" y1="146" x2="170" y2="156"/><line x1="220" y1="146" x2="220" y2="156"/>
      </g>
      <rect x="44" y="62" width="202" height="134" rx="10" fill="none" stroke="#f0a35e" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <text x="145" y="216" fill="#f0a35e" font-size="9" text-anchor="middle">必须满配 1:1 无收敛贵网 + scale-up</text>

      <!-- middle: same bricks -->
      <text x="460" y="120" fill="#9bc96b" font-size="13" text-anchor="middle" font-weight="600">同样的</text>
      <text x="460" y="138" fill="#9bc96b" font-size="13" text-anchor="middle" font-weight="600">积木</text>
      <g>
        <rect x="430" y="150" width="14" height="11" rx="2" fill="#1e1820" stroke="#d6705f" stroke-width="0.7"/>
        <rect x="450" y="150" width="14" height="11" rx="2" fill="#14201f" stroke="#56c2cf" stroke-width="0.7"/>
        <rect x="470" y="150" width="14" height="11" rx="2" fill="#1a1410" stroke="#f0a35e" stroke-width="0.7"/>
      </g>
      <text x="460" y="100" fill="#6d6d77" font-size="20" text-anchor="middle">⇄</text>

      <!-- right: inference fleet (independent units) -->
      <text x="640" y="34" fill="#56c2cf" font-size="12" font-weight="600">推理 · 一支服务器舰队</text>
      <text x="640" y="50" fill="#5a8e94" font-size="9">一排独立副本 · 各干各的 · 坏一个不影响别人</text>
      <!-- load balancer -->
      <rect x="650" y="64" width="230" height="22" rx="6" fill="#16161a" stroke="#7d8aa8" stroke-width="0.8"/>
      <text x="765" y="79" fill="#aab4c8" font-size="8.5" text-anchor="middle">负载均衡 · 普通以太网</text>
      <g fill="#171420" stroke="#56c2cf" stroke-width="0.8">
        <rect x="650" y="104" width="50" height="44" rx="8"/><rect x="710" y="104" width="50" height="44" rx="8"/><rect x="770" y="104" width="50" height="44" rx="8"/><rect x="830" y="104" width="50" height="44" rx="8"/>
      </g>
      <g fill="#56c2cf" font-size="8" text-anchor="middle"><text x="675" y="130">副本</text><text x="735" y="130">副本</text><text x="795" y="130">副本</text><text x="855" y="130">副本</text></g>
      <!-- LB to replicas (loose) -->
      <g stroke="#7d8aa8" stroke-width="0.9" opacity="0.6"><line x1="690" y1="86" x2="675" y2="104"/><line x1="740" y1="86" x2="735" y2="104"/><line x1="790" y1="86" x2="795" y2="104"/><line x1="840" y1="86" x2="855" y2="104"/></g>
      <!-- no inter-replica link -->
      <g stroke="#6d6d77" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.5"><line x1="700" y1="142" x2="710" y2="142"/><line x1="760" y1="142" x2="770" y2="142"/><line x1="820" y1="142" x2="830" y2="142"/></g>
      <text x="765" y="170" fill="#5a8e94" font-size="8" text-anchor="middle">副本间无需高速互连(虚线)</text>
      <text x="765" y="216" fill="#56c2cf" font-size="9" text-anchor="middle">普通以太网 + 弹性增减,按需扩缩</text>
    </svg>