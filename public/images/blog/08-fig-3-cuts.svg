<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 462" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans SC, JetBrains Mono, sans-serif"><rect x="0" y="0" width="920" height="462" fill="#0f0f10"/>
          <defs><marker id="dn" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8a8a92"/></marker></defs>

          <!-- intro: model = stack of layers -->
          <text x="28" y="26" fill="#e9e9ec" font-size="11.5" font-weight="500">一个模型 = 一摞按顺序算的「层」(数据从一头进,答案从另一头出)——这一摞,就是要被切开分给多张卡的东西:</text>
          <text x="296" y="73" fill="#a3a3ad" font-size="10">输入 →</text>
          <g fill="#1e1820" stroke="#d6705f" stroke-width="0.9">
            <rect x="345" y="56" width="40" height="26" rx="4"/><rect x="393" y="56" width="40" height="26" rx="4"/>
            <rect x="441" y="56" width="40" height="26" rx="4"/><rect x="489" y="56" width="40" height="26" rx="4"/>
            <rect x="537" y="56" width="40" height="26" rx="4"/>
          </g>
          <g fill="#d6705f" font-size="8.5" text-anchor="middle"><text x="365" y="73">层1</text><text x="413" y="73">层2</text><text x="461" y="73">层3</text><text x="509" y="73">层4</text><text x="557" y="73">层5</text></g>
          <text x="586" y="73" fill="#a3a3ad" font-size="10">→ 输出</text>

          <line x1="20" y1="100" x2="900" y2="100" stroke="#2b2b33" stroke-width="0.7" stroke-dasharray="3 4"/>

          <!-- ===== column headers ===== -->
          <rect x="20"  y="112" width="278" height="32" rx="9" fill="rgba(86,194,207,.06)" stroke="#56c2cf" stroke-width="0.8"/>
          <text x="34" y="127" fill="#56c2cf" font-size="11.5" font-weight="600">数据并行 DP</text>
          <text x="34" y="139" fill="#a3a3ad" font-size="8.5">复制整个模型</text>
          <text x="286" y="133" fill="#56c2cf" font-size="11" text-anchor="end" letter-spacing="1">●●○○</text>

          <rect x="320" y="112" width="278" height="32" rx="9" fill="rgba(86,194,207,.06)" stroke="#56c2cf" stroke-width="0.8"/>
          <text x="334" y="127" fill="#56c2cf" font-size="11.5" font-weight="600">流水线并行 PP</text>
          <text x="334" y="139" fill="#a3a3ad" font-size="8.5">按层分段接力</text>
          <text x="586" y="133" fill="#56c2cf" font-size="11" text-anchor="end" letter-spacing="1">●●○○</text>

          <rect x="620" y="112" width="278" height="32" rx="9" fill="rgba(240,163,94,.08)" stroke="#f0a35e" stroke-width="0.9"/>
          <text x="634" y="127" fill="#f0a35e" font-size="11.5" font-weight="600">张量并行 TP</text>
          <text x="634" y="139" fill="#9a8a78" font-size="8.5">切开每一层</text>
          <text x="886" y="133" fill="#f0a35e" font-size="11" text-anchor="end" letter-spacing="1">●●●●</text>

          <!-- ===== DP column ===== -->
          <g fill="#1a1a20">
            <rect x="38"  y="166" width="116" height="50" rx="9" stroke="#e08a6a" stroke-width="0.9"/>
            <rect x="162" y="166" width="116" height="50" rx="9" stroke="#e0c468" stroke-width="0.9"/>
            <rect x="38"  y="226" width="116" height="50" rx="9" stroke="#9bc96b" stroke-width="0.9"/>
            <rect x="162" y="226" width="116" height="50" rx="9" stroke="#56c2cf" stroke-width="0.9"/>
          </g>
          <!-- full-model glyph (3 bars) + labels in each -->
          <g stroke-width="0">
            <g fill="#3a2e28"><rect x="48" y="176" width="24" height="4" rx="1"/><rect x="48" y="183" width="24" height="4" rx="1"/><rect x="48" y="190" width="24" height="4" rx="1"/></g>
            <g fill="#3a2e28"><rect x="172" y="176" width="24" height="4" rx="1"/><rect x="172" y="183" width="24" height="4" rx="1"/><rect x="172" y="190" width="24" height="4" rx="1"/></g>
            <g fill="#3a2e28"><rect x="48" y="236" width="24" height="4" rx="1"/><rect x="48" y="243" width="24" height="4" rx="1"/><rect x="48" y="250" width="24" height="4" rx="1"/></g>
            <g fill="#3a2e28"><rect x="172" y="236" width="24" height="4" rx="1"/><rect x="172" y="243" width="24" height="4" rx="1"/><rect x="172" y="250" width="24" height="4" rx="1"/></g>
          </g>
          <g font-size="9" font-weight="600">
            <text x="86" y="184" fill="#e08a6a">GPU1</text><text x="210" y="184" fill="#e0c468">GPU2</text>
            <text x="86" y="244" fill="#9bc96b">GPU3</text><text x="210" y="244" fill="#56c2cf">GPU4</text>
          </g>
          <g font-size="8" fill="#a3a3ad">
            <text x="86" y="200">完整模型</text><text x="210" y="200">完整模型</text>
            <text x="86" y="260">完整模型</text><text x="210" y="260">完整模型</text>
            <text x="86" y="210" fill="#7d8aa8">数据①</text><text x="210" y="210" fill="#7d8aa8">数据②</text>
            <text x="86" y="270" fill="#7d8aa8">数据③</text><text x="210" y="270" fill="#7d8aa8">数据④</text>
          </g>
          <rect x="38" y="286" width="240" height="20" rx="6" fill="rgba(86,194,207,.07)" stroke="#56c2cf" stroke-width="0.7"/>
          <text x="158" y="299" fill="#56c2cf" font-size="8.5" text-anchor="middle">↕ 每步末尾:汇总对一次答案</text>
          <text x="38" y="330" fill="#a3a3ad" font-size="9">每张卡都装<tspan fill="#e9e9ec">完整模型</tspan>,各吃不同的数据,</text>
          <text x="38" y="344" fill="#a3a3ad" font-size="9">算完才汇总一次 → <tspan fill="#56c2cf">聊得少</tspan>,放<tspan fill="#56c2cf">第 2/3 圈</tspan></text>

          <!-- ===== PP column ===== -->
          <text x="459" y="164" fill="#a3a3ad" font-size="9" text-anchor="middle">数据从上往下流 ↓</text>
          <g>
            <rect x="399" y="170" width="120" height="28" rx="6" fill="#1a1a20" stroke="#e08a6a" stroke-width="0.9"/>
            <rect x="399" y="210" width="120" height="28" rx="6" fill="#1a1a20" stroke="#e0c468" stroke-width="0.9"/>
            <rect x="399" y="250" width="120" height="28" rx="6" fill="#1a1a20" stroke="#9bc96b" stroke-width="0.9"/>
            <rect x="399" y="290" width="120" height="28" rx="6" fill="#1a1a20" stroke="#56c2cf" stroke-width="0.9"/>
          </g>
          <g font-size="8.5" text-anchor="middle">
            <text x="459" y="188" fill="#e08a6a">GPU1 · 算 层1–2</text>
            <text x="459" y="228" fill="#e0c468">GPU2 · 算 层3</text>
            <text x="459" y="268" fill="#9bc96b">GPU3 · 算 层4</text>
            <text x="459" y="308" fill="#56c2cf">GPU4 · 算 层5</text>
          </g>
          <g stroke="#8a8a92" stroke-width="1.2" marker-end="url(#dn)">
            <line x1="459" y1="198" x2="459" y2="210"/><line x1="459" y1="238" x2="459" y2="250"/><line x1="459" y1="278" x2="459" y2="290"/>
          </g>
          <text x="459" y="334" fill="#a3a3ad" font-size="9" text-anchor="middle">每张卡只负责<tspan fill="#e9e9ec">几层</tspan>,像流水线接力,</text>
          <text x="459" y="348" fill="#a3a3ad" font-size="9" text-anchor="middle">只在<tspan fill="#56c2cf">交接处</tspan>传一次 → 放<tspan fill="#56c2cf">第 2 圈</tspan></text>

          <!-- ===== TP column ===== -->
          <text x="638" y="164" fill="#9a8a78" font-size="9">把「某一层」放大看 ↓ 它被竖着切成 4 片</text>
          <g>
            <rect x="638" y="172" width="247" height="56" rx="8" fill="#1a1410" stroke="#f0a35e" stroke-width="1"/>
            <line x1="699.75" y1="172" x2="699.75" y2="228" stroke="#f0a35e" stroke-width="0.7" opacity="0.6"/>
            <line x1="761.5"  y1="172" x2="761.5"  y2="228" stroke="#f0a35e" stroke-width="0.7" opacity="0.6"/>
            <line x1="823.25" y1="172" x2="823.25" y2="228" stroke="#f0a35e" stroke-width="0.7" opacity="0.6"/>
          </g>
          <rect x="640" y="174" width="58" height="52" rx="6" fill="rgba(224,138,106,.16)"/>
          <rect x="701" y="174" width="58" height="52" rx="6" fill="rgba(224,196,104,.16)"/>
          <rect x="763" y="174" width="58" height="52" rx="6" fill="rgba(155,201,107,.16)"/>
          <rect x="825" y="174" width="58" height="52" rx="6" fill="rgba(86,194,207,.16)"/>
          <text x="761" y="204" fill="#f0a35e" font-size="9" text-anchor="middle" font-weight="500">这一层 · 4 卡同时算</text>
          <g font-size="8" text-anchor="middle">
            <text x="669" y="241" fill="#e08a6a">GPU1</text><text x="730" y="241" fill="#e0c468">GPU2</text>
            <text x="792" y="241" fill="#9bc96b">GPU3</text><text x="854" y="241" fill="#56c2cf">GPU4</text>
          </g>
          <rect x="638" y="252" width="247" height="20" rx="6" fill="rgba(240,163,94,.1)" stroke="#f0a35e" stroke-width="0.7"/>
          <text x="761" y="265" fill="#f0a35e" font-size="8.5" text-anchor="middle">⊕ 算完立刻合并(对一次答案)</text>
          <text x="761" y="290" fill="#9a8a78" font-size="8.5" text-anchor="middle">↓ 下一层,再切、再算、再合并 …</text>
          <text x="638" y="330" fill="#a3a3ad" font-size="9">4 卡<tspan fill="#e9e9ec">合算同一层</tspan>,<tspan fill="#f0a35e">每过一层就合并一次</tspan>,</text>
          <text x="638" y="344" fill="#a3a3ad" font-size="9"><tspan fill="#f0a35e">聊得最勤</tspan> → 必须放<tspan fill="#f0a35e">第 1 圈(NVLink)</tspan></text>

          <!-- bottom note -->
          <line x1="20" y1="372" x2="900" y2="372" stroke="#2b2b33" stroke-width="0.7" stroke-dasharray="3 4"/>
          <text x="28" y="396" fill="#e9e9ec" font-size="10.5" font-weight="500">实战里三种<tspan fill="#f0a35e">叠加</tspan>使用:先 TP 切开每层 → 再 PP 按深度分段 → 最后 DP 复制多份。</text>
          <text x="28" y="414" fill="#a3a3ad" font-size="10">规律不变:<tspan fill="#f0a35e">聊得越勤的切法(TP),放进越里面、越快的圈</tspan>;聊得少的(PP/DP)放外圈。这就是上一张同心圆的由来。</text>
        </svg>