<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans SC, JetBrains Mono, sans-serif"><rect x="0" y="0" width="920" height="470" fill="#0f0f10"/>
          <!-- rings -->
          <circle cx="250" cy="235" r="200" fill="rgba(125,138,168,.05)" stroke="#7d8aa8" stroke-width="0.8" stroke-dasharray="5 4"/>
          <circle cx="250" cy="235" r="128" fill="rgba(86,194,207,.06)" stroke="#56c2cf" stroke-width="0.9"/>
          <circle cx="250" cy="235" r="64"  fill="rgba(240,163,94,.10)" stroke="#f0a35e" stroke-width="1"/>
          <!-- center NVSwitch + 8 gpus -->
          <rect x="240" y="225" width="20" height="20" rx="4" fill="#241d14" stroke="#f0a35e" stroke-width="0.8"/>
          <g fill="#1e1820" stroke="#d6705f" stroke-width="0.9">
            <circle cx="290"   cy="235"   r="9.5"/><circle cx="278.3" cy="263.3" r="9.5"/>
            <circle cx="250"   cy="275"   r="9.5"/><circle cx="221.7" cy="263.3" r="9.5"/>
            <circle cx="210"   cy="235"   r="9.5"/><circle cx="221.7" cy="206.7" r="9.5"/>
            <circle cx="250"   cy="195"   r="9.5"/><circle cx="278.3" cy="206.7" r="9.5"/>
          </g>
          <!-- spokes -->
          <g stroke="#f0a35e" stroke-width="1.3" opacity="0.55">
            <line x1="250" y1="235" x2="290" y2="235"/><line x1="250" y1="235" x2="250" y2="275"/>
            <line x1="250" y1="235" x2="210" y2="235"/><line x1="250" y1="235" x2="250" y2="195"/>
            <line x1="250" y1="235" x2="278.3" y2="263.3"/><line x1="250" y1="235" x2="221.7" y2="263.3"/>
            <line x1="250" y1="235" x2="221.7" y2="206.7"/><line x1="250" y1="235" x2="278.3" y2="206.7"/>
          </g>
          <!-- ring number badges -->
          <circle cx="250" cy="171" r="11" fill="#f0a35e"/><text x="250" y="175" fill="#1a1208" font-size="11" text-anchor="middle" font-weight="700">1</text>
          <circle cx="250" cy="107" r="11" fill="#56c2cf"/><text x="250" y="111" fill="#0a1718" font-size="11" text-anchor="middle" font-weight="700">2</text>
          <circle cx="250" cy="35"  r="11" fill="#7d8aa8"/><text x="250" y="39"  fill="#0d0f14" font-size="11" text-anchor="middle" font-weight="700">3</text>

          <!-- explanation cards -->
          <!-- 1 -->
          <rect x="500" y="34" width="400" height="118" rx="13" fill="#16161a" stroke="#f0a35e" stroke-width="0.8"/>
          <circle cx="522" cy="58" r="11" fill="#f0a35e"/><text x="522" y="62" fill="#1a1208" font-size="11" text-anchor="middle" font-weight="700">1</text>
          <text x="544" y="62" fill="#f0a35e" font-size="13" font-weight="600">同一台服务器内的 8 张卡 · NVLink</text>
          <text x="518" y="84"  fill="#e9e9ec" font-size="11">它们每算完一层就要核对一次答案,<tspan fill="#f0a35e" font-weight="500">聊得最勤</tspan>,</text>
          <text x="518" y="102" fill="#e9e9ec" font-size="11">所以用最粗最快的线"焊"在一起,任意两卡全速直连。</text>
          <text x="518" y="128" fill="#9a8a78" font-size="9.5" font-family="JetBrains Mono">速度:900 GB/s · 约等于"同桌交头接耳"</text>

          <!-- 2 -->
          <rect x="500" y="166" width="400" height="118" rx="13" fill="#16161a" stroke="#56c2cf" stroke-width="0.8"/>
          <circle cx="522" cy="190" r="11" fill="#56c2cf"/><text x="522" y="194" fill="#0a1718" font-size="11" text-anchor="middle" font-weight="700">2</text>
          <text x="544" y="194" fill="#56c2cf" font-size="13" font-weight="600">服务器与服务器之间 · InfiniBand 网络</text>
          <text x="518" y="216" fill="#e9e9ec" font-size="11">每训练一步才同步一次,<tspan fill="#56c2cf" font-weight="500">没那么勤</tspan>,所以用</text>
          <text x="518" y="234" fill="#e9e9ec" font-size="11">稍慢、但能拉得很远的高速网线连接成百上千台机器。</text>
          <text x="518" y="260" fill="#5a8e94" font-size="9.5" font-family="JetBrains Mono">速度:400 Gb/s · 约等于"隔壁桌传纸条"</text>

          <!-- 3 -->
          <rect x="500" y="298" width="400" height="118" rx="13" fill="#16161a" stroke="#7d8aa8" stroke-width="0.8"/>
          <circle cx="522" cy="322" r="11" fill="#7d8aa8"/><text x="522" y="326" fill="#0d0f14" font-size="11" text-anchor="middle" font-weight="700">3</text>
          <text x="544" y="326" fill="#aab4c8" font-size="13" font-weight="600">整个集群 · 上千台机器汇成一片</text>
          <text x="518" y="348" fill="#e9e9ec" font-size="11">越往外,线越慢但数量越多。能堆多大,</text>
          <text x="518" y="366" fill="#e9e9ec" font-size="11">通常<tspan fill="#aab4c8" font-weight="500">不是被 GPU 数量卡住,而是被供电和散热卡住</tspan>。</text>
          <text x="518" y="392" fill="#7d8aa8" font-size="9.5" font-family="JetBrains Mono">规模:1 万 – 10 万+ 张卡 · 约等于"整栋楼广播"</text>
        </svg>